[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gtfo-skin-forge"
version = "0.1.53"
description = "GTFO weapon texture replacement desktop application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
    "UnityPy>=1.20",
    "Pillow>=11",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pyinstaller>=6.11",
]

[project.scripts]
gtfo-skin-forge = "gtfo_skin_forge.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gtfo_skin_forge = [
    "data/*",
    "data/preview_meshes/*/*",
    "data/dly_plugin/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
